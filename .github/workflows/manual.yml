name: Binance Scanner
on:
  schedule:
    - cron: '0 * * * *' # Every hour
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Libs
        run: pip install -r requirements.txt
      - name: Run
        run: python scanner.py
